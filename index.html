<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OfficeAgent Web - ACS プレイヤー</title>
    <style>
      body { font-family: "Segoe UI", "Yu Gothic UI", sans-serif; margin: 16px; }
      #stage { display: block; margin: 16px 0; background: #f4f4f4; border: 1px solid #ccc; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      #status { color: #555; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>OfficeAgent Web</h1>
    <p>.acs ファイルを選択するか、この画面にドラッグ&amp;ドロップしてください。</p>
    <div class="row">
      <input id="file" type="file" accept=".acs" />
      <select id="animations" disabled></select>
      <button id="play" disabled>再生</button>
    </div>
    <canvas id="stage" width="128" height="128"></canvas>
    <div id="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
