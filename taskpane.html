<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カイル君</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      html { height: 100%; }
      body { font-family: "Segoe UI", "Yu Gothic UI", sans-serif; margin: 0; padding: 12px; font-size: 13px; min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; }
      /* 吹き出し + カイル君を作業ウィンドウの下端に寄せる */
      #dock { margin-top: auto; padding-top: 16px; }
      #stage { display: block; margin: 0 auto; cursor: pointer; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
      .muted { color: #888; }
      #selection { color: #555; margin-top: 12px; padding: 8px; background: #f4f4f4; border-radius: 4px; white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow: auto; }
      #host { text-align: center; margin-bottom: 4px; }

      /* Microsoft Agent 風の吹き出し。テーマ (ライト/ダーク) に関わらず同じ配色にする */
      .balloon {
        position: relative;
        margin: 0 4px 18px;
        padding: 10px;
        background: #ffffe1;
        color: #000;
        border: 1px solid #000;
        border-radius: 10px;
        box-shadow: 2px 3px 0 rgba(0, 0, 0, 0.25);
      }
      /* しっぽ (下のカイル君を指す)。外側が枠線、内側が塗り */
      .balloon::before,
      .balloon::after {
        content: "";
        position: absolute;
        left: 50%;
        border-style: solid;
        border-color: transparent;
      }
      .balloon::before { bottom: -13px; margin-left: -9px; border-width: 13px 9px 0; border-top-color: #000; }
      .balloon::after { bottom: -11px; margin-left: -8px; border-width: 12px 8px 0; border-top-color: #ffffe1; }
      .balloon input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #b5b58a;
        border-radius: 4px;
        background: #fff;
        color: #000;
        font: inherit;
      }
      .balloon input[type="text"]:focus { outline: 2px solid #f0b400; outline-offset: 0; }
      .balloon select, .balloon button { font: inherit; color: #000; }
    </style>
  </head>
  <body>
    <div id="host" class="muted"></div>
    <div class="row">
      <label><input id="file" type="file" accept=".acs" hidden /><button id="pick" type="button">キャラクターを選ぶ (.acs)</button></label>
      <label><input id="sound" type="checkbox" checked /> 効果音</label>
    </div>
    <div class="row" style="margin-top:8px">
      <select id="animations" disabled style="max-width:200px"></select>
      <button id="play" type="button" disabled>再生</button>
    </div>
    <div id="status" class="muted" style="text-align:center;margin-top:8px"></div>
    <div id="selection" class="muted">選択範囲がここに表示されます</div>
    <div id="selection-info" class="muted" style="margin-top:4px;font-size:11px"></div>

    <div id="dock">
      <div class="balloon">
        <input id="query" type="text" placeholder="調べたいことを入力" />
        <div class="row" style="margin-top:8px">
          <select id="engine"></select>
          <button id="search" type="button">検索</button>
        </div>
      </div>
      <canvas id="stage" width="128" height="128" title="クリックでアニメーション"></canvas>
    </div>
    <script type="module" src="/src/taskpane.ts"></script>
  </body>
</html>
