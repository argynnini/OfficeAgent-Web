<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カイル君</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      body { font-family: "Segoe UI", "Yu Gothic UI", sans-serif; margin: 0; padding: 12px; font-size: 13px; }
      #stage { display: block; margin: 8px auto; cursor: pointer; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
      .muted { color: #666; }
      #selection { margin-top: 12px; padding: 8px; background: #f4f4f4; border-radius: 4px; white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow: auto; }
      #host { text-align: center; margin-bottom: 4px; }
    </style>
  </head>
  <body>
    <div id="host" class="muted"></div>
    <canvas id="stage" width="128" height="128" title="クリックでアニメーション"></canvas>
    <div class="row">
      <label><input id="file" type="file" accept=".acs" hidden /><button id="pick" type="button">キャラクターを選ぶ (.acs)</button></label>
      <label><input id="sound" type="checkbox" checked /> 効果音</label>
    </div>
    <div class="row" style="margin-top:8px">
      <select id="animations" disabled style="max-width:200px"></select>
      <button id="play" type="button" disabled>再生</button>
    </div>
    <div id="status" class="muted" style="text-align:center;margin-top:8px"></div>
    <div class="row" style="margin-top:12px;flex-wrap:nowrap">
      <input id="query" type="text" placeholder="調べたいことを入力" style="flex:1;min-width:0" />
    </div>
    <div class="row" style="margin-top:6px">
      <select id="engine"></select>
      <button id="search" type="button">検索</button>
    </div>
    <div id="selection" class="muted">選択範囲がここに表示されます</div>
    <div id="selection-info" class="muted" style="margin-top:4px;font-size:11px"></div>
    <script type="module" src="/src/taskpane.ts"></script>
  </body>
</html>
