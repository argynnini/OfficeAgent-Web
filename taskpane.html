<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>カイル君</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <style>
      html { height: 100%; }
      body { font-family: "Segoe UI", "Yu Gothic UI", sans-serif; margin: 0; padding: 12px; font-size: 13px; min-height: 100%; box-sizing: border-box; display: flex; flex-direction: column; }
      /* 吹き出し + カイル君を作業ウィンドウの下端に寄せる */
      #dock { margin-top: auto; padding-top: 16px; }
      #stage { display: block; cursor: pointer; }
      /* カイル君は中央、キャラ選択と効果音のボタンは右端に縦並び (左右 1fr の 3 列) */
      .stage-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; }
      .stage-row #stage { grid-column: 2; }
      .icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; padding: 0; background: #fff; border: 1px solid #999; border-radius: 4px; cursor: pointer; }
      /* 効果音のトグル: オン=音波、オフ=赤い × */
      .icon-btn[aria-pressed="true"] .off, .icon-btn[aria-pressed="false"] .on { display: none; }
      .icon-btn[aria-pressed="false"] { background: #e8e8e8; }
      /* 再生ボタンのサブメニュー: ホバー/フォーカスで左に開く。キャラ未選択(空)のときは出さない */
      .menu-wrap { position: relative; }
      .flyout { display: none; position: absolute; right: 100%; bottom: 0; z-index: 10; min-width: 150px; max-height: min(320px, 70vh); overflow-y: auto; padding: 3px; background: #fff; border: 1px solid #999; border-radius: 4px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); }
      .menu-wrap:hover .flyout, .menu-wrap:focus-within .flyout { display: block; }
      .flyout:empty { display: none !important; }
      .flyout button { display: block; width: 100%; padding: 3px 10px; background: transparent; border: 0; border-radius: 3px; color: #000; font: 12px "Segoe UI", "Yu Gothic UI", sans-serif; text-align: left; white-space: nowrap; cursor: pointer; }
      .flyout button:hover, .flyout button:focus-visible { background: #ffff9a; outline: none; }
      /* 再生ボタン: 待機中は ▶、再生中は ■ */
      #play[data-playing="false"] .stop-icon, #play[data-playing="true"] .play-icon { display: none; }
      .icon-btn:hover { background: #f0f0f0; border-color: #666; }
      .side { grid-column: 3; justify-self: end; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; padding-bottom: 8px; }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
      .muted { color: #888; }
      #selection { color: #555; margin-top: 12px; padding: 8px; background: #f4f4f4; border-radius: 4px; white-space: pre-wrap; word-break: break-all; max-height: 120px; overflow: auto; }
      #host { text-align: center; margin-bottom: 4px; }

      /*
       * 検索吹き出し。VSTO 版 SearchBalloonForm と同じ配色・寸法:
       *   背景 RGB(255,255,154) / 枠 RGB(160,130,30) 2px / 角丸 15 / しっぽ 高さ14・半幅9・先端は右に12
       * テーマ (ライト/ダーク) に関わらず同じ配色にする
       */
      .balloon {
        position: relative;
        box-sizing: border-box;
        max-width: 390px;
        /* しっぽ (高さ 14px) が本体の下に飛び出す分だけ下げて、先端をカイル君のすぐ上に置く */
        margin: 0 auto 2px;
        padding: 8px 12px 10px;
        background: #ffff9a;
        color: #000;
        border: 2px solid #a0821e;
        border-radius: 12px;
        font-family: "MS UI Gothic", "Yu Gothic UI", sans-serif;
      }
      /* しっぽ: 下枠線を塗りで隠して斜辺だけ線を引く (VSTO は輪郭が 1 本の連続した線) */
      .balloon .tail { position: absolute; top: 100%; left: max(24px, calc(50% - 9px - 80px)); width: 22px; height: 16px; overflow: visible; }
      .balloon .title { font-size: 15px; margin: 2px 0 8px; }
      .balloon textarea {
        display: block;
        width: 100%;
        box-sizing: border-box;
        padding: 2px 4px;
        border: 1px solid #000;
        background: #fff;
        color: #000;
        font: 13px/1.3 "MS UI Gothic", "Yu Gothic UI", sans-serif;
        /* ちょうど 2 行分: 行高 1.3em x 2 + 上下 padding 4px + 枠 2px */
        height: calc(2.6em + 6px);
        resize: none;
      }
      .balloon textarea::placeholder { color: #a0a0a0; opacity: 1; }
      .balloon textarea:focus { outline: none; }
      .balloon textarea:focus::placeholder { color: transparent; }
      .balloon .buttons { display: flex; gap: 8px; margin-top: 8px; }
      .balloon button {
        flex: 1;
        max-width: 96px;
        height: 26px;
        background: #ffff9a;
        color: #000;
        border: 1px solid #000;
        font: 13px "MS UI Gothic", "Yu Gothic UI", sans-serif;
        cursor: pointer;
      }
      .balloon select {
        flex: 1;
        min-width: 0;
        height: 26px;
        padding: 0 2px;
        background: #ffff9a;
        color: #000;
        border: 1px solid #000;
        border-radius: 0;
        font: 13px "MS UI Gothic", "Yu Gothic UI", sans-serif;
        cursor: pointer;
      }
      .balloon button:hover { background: #ffffc4; }
      .balloon button:active { background: #f0f07a; }
    </style>
  </head>
  <body>
    <div id="host" class="muted"></div>
    <div id="status" class="muted" style="text-align:center;margin-top:8px"></div>
    <div id="selection" class="muted">選択範囲がここに表示されます</div>
    <div id="selection-info" class="muted" style="margin-top:4px;font-size:11px"></div>

    <div id="dock">
      <div class="balloon">
        <div class="title">何について調べますか？</div>
        <textarea id="query" maxlength="10000" placeholder="ここに質問文を入力し、［検索］ をクリックしてください！"></textarea>
        <div class="buttons">
          <select id="engine" title="検索エンジン"></select>
          <button id="search" type="button" title="Alt+S">検索(<u>S</u>)</button>
        </div>
        <svg class="tail" viewBox="0 0 22 16" aria-hidden="true">
          <polygon points="0,0 18,0 21,16" fill="#ffff9a" />
          <polyline points="0,0 21,16 18,0" fill="none" stroke="#a0821e" stroke-width="2" />
          <line x1="1" y1="-1" x2="17" y2="-1" stroke="#ffff9a" stroke-width="3" />
        </svg>
      </div>
      <div class="stage-row">
        <canvas id="stage" width="128" height="128" title="クリックでアニメーション"></canvas>
        <div class="side">
          <input id="file" type="file" accept=".acs" hidden />
          <button id="pick" type="button" class="icon-btn" title="キャラクターを選ぶ&#10;.acs ファイル (Microsoft Agent のキャラクター) を読み込みます。&#10;一度選ぶと、次回から自動で読み込みます。" aria-label="キャラクターを選ぶ">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2.5h8.5A1.5 1.5 0 0 1 21 9v9.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z" fill="#f5c542" stroke="#8a6d1a" stroke-width="1.3" stroke-linejoin="round"/><path d="M3 10.5h18" stroke="#8a6d1a" stroke-width="1.3"/></svg>
          </button>
          <button id="sound" type="button" class="icon-btn" aria-pressed="true" aria-label="効果音">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z" fill="#555" stroke="#333" stroke-width="1.2" stroke-linejoin="round"/>
              <g class="on" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"><path d="M15 9.2a4 4 0 0 1 0 5.6"/><path d="M17.6 6.8a7.5 7.5 0 0 1 0 10.4"/></g>
              <g class="off" stroke="#c0392b" stroke-width="2" stroke-linecap="round"><path d="M15 9.5l5 5"/><path d="M20 9.5l-5 5"/></g>
            </svg>
          </button>
          <div class="menu-wrap">
            <button id="play" type="button" class="icon-btn" aria-haspopup="menu" aria-label="アニメーションを再生 / 停止" data-playing="false" title="アニメーションを再生&#10;マウスを載せると一覧から選べます。">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path class="play-icon" d="M8 5.5v13l11-6.5z" fill="#2e8b57" stroke="#1d5c3a" stroke-width="1.3" stroke-linejoin="round"/>
                <rect class="stop-icon" x="6.5" y="6.5" width="11" height="11" rx="1.5" fill="#c0392b" stroke="#8e2a20" stroke-width="1.3"/>
              </svg>
            </button>
            <div id="flyout" class="flyout" role="menu" aria-label="アニメーション"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/taskpane.ts"></script>
  </body>
</html>
